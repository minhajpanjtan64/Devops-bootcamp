services:
  app:
    build: .
    ports:
      - "80:80"
    env_file:
      - .env.docker
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: jobs_portal
      MYSQL_USER: jobs_user
      MYSQL_PASSWORD: JobsPass2026
      MYSQL_ROOT_PASSWORD: RootPass2026
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pRootPass2026"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  dbdata:
